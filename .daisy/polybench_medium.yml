      loops: true
    gesummv:
      command: ./linear-algebra/blas/gesummv/gesummv.out
      measurements: 5
      profiler: perf
      loops: true
    symm:
      command: ./linear-algebra/blas/symm/symm.out
      measurements: 5
      profiler: perf
      loops: true
    syr2k:
      command: ./linear-algebra/blas/syr2k/syr2k.out
      measurements: 5
      profiler: perf
      loops: true
    syrk:
      command: ./linear-algebra/blas/syrk/syrk.out
      measurements: 5
      profiler: perf
      loops: true
    trmm:
      command: ./linear-algebra/blas/trmm/trmm.out
      measurements: 5
      profiler: perf
      loops: true
    2mm:
      command: ./linear-algebra/kernels/2mm/2mm.out
