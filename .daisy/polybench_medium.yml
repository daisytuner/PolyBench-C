on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

parameters:
  timeout: 60
  partitions:
    - zinnia

steps:
  build: |
    cd linear-algebra/blas/gemm
    docc -Xclang -no-opaque-pointers -mllvm -hotspot -g -O2 -DMEDIUM_DATASET -DDATA_TYPE_IS_DOUBLE -I../../../utilities ../../../utilities/polybench.c gemm.c -o gemm.out -lm -ldaisy_rtl
    cd ../../../

    cd linear-algebra/blas/syr2k
    docc -Xclang -no-opaque-pointers -mllvm -hotspot -g -O2 -DMEDIUM_DATASET -DDATA_TYPE_IS_DOUBLE -I../../../utilities ../../../utilities/polybench.c syr2k.c -o syr2k.out -lm -ldaisy_rtl
    cd ../../../

  run:
    gemm:
      command: ./linear-algebra/blas/gemm/gemm.out
      measurements: 1
      loops: true
      metrics:
        - runtime
        - flops_dp
    syr2k:
      command: ./linear-algebra/blas/syr2k/syr2k.out
      measurements: 1
      loops: true
      metrics:
        - runtime
        - flops_dp
